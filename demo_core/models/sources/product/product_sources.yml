version: 2

sources:
  - name: product
    description: Product telemetry received from application event tracking.
    database: CORE_RAW
    schema: PRODUCT
    loader: R-generated CSV loaded to Snowflake
    config:
      loaded_at_field: _LOADED_AT
      freshness:
        warn_after: {count: 3, period: hour}
        error_after: {count: 6, period: hour}
    tables:
      - name: events
        identifier: EVENTS
        description: Append-only product events with JSON properties stored as source text.
