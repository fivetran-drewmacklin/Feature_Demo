version: 2

models:
  - name: stg_crm__accounts
    description: Cleaned current-state CRM accounts with normalized domains and countries.
    columns:
      - name: account_id
        description: Stable source identifier for the CRM account.
        data_tests:
          - unique
          - not_null
      - name: account_name
        description: Trimmed source account name.
        data_tests:
          - not_null
      - name: website_domain
        description: Lowercase domain with protocol, www prefix, and trailing slash removed.
      - name: billing_country_raw
        description: Original free-text billing country retained for auditability.
      - name: billing_country
        description: Canonical country name, UNKNOWN when a non-null source value cannot be mapped.
      - name: billing_country_code
        description: ISO alpha-2 code, UNKNOWN when a non-null source value cannot be mapped.
        data_tests:
          - accepted_values:
              arguments:
                values: [US, CA, GB, DE, FR, AU, NL, IE, ES, JP]
              config:
                severity: warn
                store_failures: true
      - name: industry
        description: Trimmed source industry.
      - name: employee_count
        description: Source estimate of current employees.
      - name: annual_revenue
        description: Source annual revenue estimate in the account currency.
      - name: account_currency
        description: Uppercase ISO currency code for account estimates.
        data_tests:
          - accepted_values:
              arguments:
                values: [USD, EUR, GBP, CAD, AUD]
      - name: account_tier
        description: Normalized commercial account tier.
        data_tests:
          - accepted_values:
              arguments:
                values: [enterprise, mid_market, smb]
      - name: owner_sales_rep_id
        description: Sales representative currently owning the account.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_crm__sales_reps')
                field: sales_rep_id
      - name: created_at
        description: Timestamp when the CRM account was created.
      - name: updated_at
        description: Timestamp of the latest source update.
      - name: is_deleted
        description: Whether the account is soft deleted in CRM.
      - name: deleted_at
        description: Timestamp of the soft deletion when applicable.
      - name: _loaded_at
        description: Timestamp when the source row landed in CORE_RAW.
