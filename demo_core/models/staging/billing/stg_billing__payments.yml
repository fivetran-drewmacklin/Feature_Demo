version: 2

models:
  - name: stg_billing__payments
    description: Cleaned payment attempts, including deliberately unmatched invoice references.
    columns:
      - name: payment_id
        description: Stable payment-attempt identifier.
        data_tests: [unique, not_null]
      - name: invoice_id
        description: Referenced invoice; known source anomalies are retained.
        data_tests:
          - relationships:
              arguments: {to: ref('stg_billing__invoices'), field: invoice_id}
              config: {severity: warn, store_failures: true}
      - name: billing_customer_id
        description: Customer making the payment.
        data_tests:
          - relationships:
              arguments: {to: ref('stg_billing__customers'), field: billing_customer_id}
      - name: status
        description: Normalized payment status.
        data_tests:
          - accepted_values:
              arguments: {values: [pending, succeeded, failed]}
      - name: payment_method
        description: Normalized payment method.
        data_tests:
          - accepted_values:
              arguments: {values: [card, bank_transfer, ach, wire]}
      - name: processor_reference
        description: Unique processor reference.
        data_tests: [unique, not_null]
