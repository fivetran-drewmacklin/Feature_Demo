version: 2

models:
  - name: int_finance_operations__fx_rates
    description: Complete daily currency-to-USD rates with most-recent-prior-date fallback.
    columns:
      - name: rate_date
        description: Calendar date to which the rate is applied.
        data_tests: [not_null]
      - name: from_currency
        description: Source currency.
        data_tests: [not_null]
      - name: rate
        description: Exact or carried-forward conversion rate to USD.
        data_tests: [not_null]
      - name: source_rate_date
        description: Date from which the applied rate originated.
        data_tests: [not_null]
      - name: used_prior_rate
        description: Whether an exact daily rate was missing and a prior rate was used.
        data_tests:
          - accepted_values:
              arguments: {values: [false]}
              config: {severity: warn, store_failures: true}

unit_tests:
  - name: test_fx_rates_use_most_recent_prior_rate
    model: int_finance_operations__fx_rates
    given:
      - input: ref('stg_market__fx_rates')
        rows:
          - {rate_date: "2025-01-01", from_currency: EUR, to_currency: USD, rate: 1.25, provider: TEST, _loaded_at: "2025-01-02 00:00:00+00"}
          - {rate_date: "2025-01-01", from_currency: USD, to_currency: USD, rate: 1.00, provider: TEST, _loaded_at: "2025-01-02 00:00:00+00"}
          - {rate_date: "2025-01-02", from_currency: USD, to_currency: USD, rate: 1.00, provider: TEST, _loaded_at: "2025-01-03 00:00:00+00"}
    expect:
      rows:
        - {rate_date: "2025-01-01", from_currency: EUR, rate: 1.25, source_rate_date: "2025-01-01", used_prior_rate: false}
        - {rate_date: "2025-01-02", from_currency: EUR, rate: 1.25, source_rate_date: "2025-01-01", used_prior_rate: true}
        - {rate_date: "2025-01-01", from_currency: USD, rate: 1.00, source_rate_date: "2025-01-01", used_prior_rate: false}
        - {rate_date: "2025-01-02", from_currency: USD, rate: 1.00, source_rate_date: "2025-01-02", used_prior_rate: false}
