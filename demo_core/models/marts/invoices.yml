version: 2

models:
  - name: invoices
    description: Governed reconciled invoice and collection facts in source currency for downstream projects.
    config:
      contract:
        enforced: true
      tags: [public_interface]
      meta:
        data_product: core
        data_classification: internal
        grain: one_invoice
    columns:
      - {name: invoice_id, description: Stable invoice identifier., data_type: varchar, constraints: [{type: not_null}], data_tests: [unique, not_null]}
      - {name: invoice_number, description: Human-readable invoice number., data_type: varchar, constraints: [{type: not_null}]}
      - {name: customer_id, description: "{{ doc('conformed_customer_id') }}", data_type: varchar, constraints: [{type: not_null}]}
      - {name: billing_customer_id, description: "{{ doc('billing_customer_id') }}", data_type: varchar, constraints: [{type: not_null}]}
      - {name: subscription_id, description: "{{ doc('subscription_id') }}", data_type: varchar}
      - {name: status, description: Normalized invoice status., data_type: varchar}
      - {name: issue_date, description: Invoice issue date., data_type: date}
      - {name: due_date, description: Invoice due date., data_type: date}
      - {name: paid_at, description: Settlement timestamp when applicable., data_type: timestamp_tz}
      - {name: currency, description: "{{ doc('currency_code') }}", data_type: varchar}
      - {name: subtotal_cents, description: Stored subtotal in minor currency units., data_type: "number(18,0)"}
      - {name: discount_cents, description: Discount magnitude in minor currency units., data_type: "number(18,0)"}
      - {name: tax_cents, description: Tax in minor currency units., data_type: "number(18,0)"}
      - {name: total_cents, description: Invoice total in minor currency units., data_type: "number(18,0)"}
      - {name: amount_due_cents, description: Outstanding accounts receivable., data_type: "number(18,0)"}
      - {name: calculated_subtotal_cents, description: Subtotal recomputed from clean invoice lines., data_type: "number(38,0)"}
      - {name: calculated_discount_cents, description: Discount recomputed from clean invoice lines., data_type: "number(38,0)"}
      - {name: calculated_tax_cents, description: Tax recomputed from clean invoice lines., data_type: "number(38,0)"}
      - {name: calculated_total_cents, description: Total recomputed from clean invoice lines., data_type: "number(38,0)"}
      - {name: successful_payment_cents, description: Successful payments applied to the invoice., data_type: "number(38,0)"}
      - {name: successful_refund_cents, description: Successful refunds associated with the invoice., data_type: "number(38,0)"}
      - {name: net_collections_cents, description: Successful payments less successful refunds., data_type: "number(38,0)"}
      - {name: is_reconciled, description: Whether stored invoice amounts reconcile to line detail., data_type: boolean}
      - {name: reconciliation_difference_cents, description: Stored total less the recomputed total., data_type: "number(38,0)"}
      - {name: record_updated_at, description: Greatest source update timestamp affecting the invoice., data_type: timestamp_tz}
      - {name: _loaded_at, description: "{{ doc('raw_loaded_at') }}", data_type: timestamp_tz}
