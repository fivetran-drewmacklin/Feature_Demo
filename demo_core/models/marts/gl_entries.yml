version: 2

models:
  - name: gl_entries
    description: Governed general-ledger lines with clean account classifications and customer linkage.
    config:
      contract:
        enforced: true
      tags: [public_interface]
      meta:
        data_product: core
        data_classification: internal
        grain: one_general_ledger_line
    columns:
      - {name: gl_entry_id, description: Stable journal-line identifier., data_type: varchar, constraints: [{type: not_null}], data_tests: [unique, not_null]}
      - {name: journal_id, description: Journal identifier shared across balanced lines., data_type: varchar, constraints: [{type: not_null}]}
      - {name: line_number, description: Line number within the journal., data_type: "number(10,0)", constraints: [{type: not_null}]}
      - {name: posted_date, description: Accounting posting date., data_type: date, constraints: [{type: not_null}]}
      - {name: account_code, description: Governed chart-of-accounts code., data_type: varchar, constraints: [{type: not_null}]}
      - {name: account_name, description: Governed account name., data_type: varchar}
      - {name: account_type, description: Governed account classification., data_type: varchar}
      - {name: financial_statement, description: Financial statement classification., data_type: varchar}
      - {name: sign_convention, description: Governed account sign convention., data_type: varchar}
      - {name: cost_center_id, description: Owning ERP cost center., data_type: varchar}
      - {name: invoice_id, description: Related billing invoice when applicable., data_type: varchar}
      - {name: customer_id, description: "{{ doc('conformed_customer_id') }}", data_type: varchar}
      - {name: description, description: Clean journal-line description., data_type: varchar}
      - {name: debit_cents, description: Debit amount in minor currency units., data_type: "number(18,0)"}
      - {name: credit_cents, description: Credit amount in minor currency units., data_type: "number(18,0)"}
      - {name: signed_amount_cents, description: Debit less credit in minor currency units., data_type: "number(18,0)"}
      - {name: currency, description: "{{ doc('currency_code') }}", data_type: varchar}
      - {name: created_at, description: Source creation timestamp., data_type: timestamp_tz}
      - {name: _loaded_at, description: "{{ doc('raw_loaded_at') }}", data_type: timestamp_tz}
