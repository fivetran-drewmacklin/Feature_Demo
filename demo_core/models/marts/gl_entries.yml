version: 2

models:
  - name: gl_entries
    description: Governed general-ledger lines with clean account classifications and customer linkage.
    config:
      contract:
        enforced: true
      tags: [public_interface]
      meta:
        data_product: core
        data_classification: internal
        grain: one_general_ledger_line
    columns:
      - {name: gl_entry_id, description: "{{ doc('gl_entry_id') }}", data_type: varchar, constraints: [{type: not_null}], data_tests: [unique, not_null]}
      - {name: journal_id, description: Identifier shared by the lines that form one accounting journal., data_type: varchar, constraints: [{type: not_null}]}
      - {name: line_number, description: Source line sequence within the journal., data_type: "number(10,0)", constraints: [{type: not_null}]}
      - {name: posted_date, description: Date the journal affects the general ledger., data_type: date, constraints: [{type: not_null}]}
      - {name: account_code, description: Governed chart-of-accounts code used to enrich account classifications., data_type: varchar, constraints: [{type: not_null}]}
      - {name: account_name, description: Governed account label from the chart of accounts., data_type: varchar}
      - {name: account_type, description: "Governed asset, liability, equity, revenue, or expense classification.", data_type: varchar}

      - {name: financial_statement, description: Balance-sheet or income-statement classification., data_type: varchar}
      - {name: sign_convention, description: Debit or credit convention used to interpret the account balance., data_type: varchar}
      - {name: cost_center_id, description: ERP cost center responsible for the journal line., data_type: varchar}
      - {name: invoice_id, description: Billing invoice associated with the journal line when available., data_type: varchar}
      - {name: customer_id, description: "{{ doc('conformed_customer_id') }}", data_type: varchar}
      - {name: description, description: Cleaned source narrative for the journal line., data_type: varchar}
      - {name: debit_cents, description: Debit amount in minor units of the journal currency., data_type: "number(18,0)"}
      - {name: credit_cents, description: Credit amount in minor units of the journal currency., data_type: "number(18,0)"}
      - {name: signed_amount_cents, description: "{{ doc('signed_amount_cents') }}", data_type: "number(18,0)"}
      - {name: currency, description: "{{ doc('currency_code') }}", data_type: varchar}
      - {name: created_at, description: Timestamp when the journal line was created in ERP., data_type: timestamp_tz}
      - {name: _loaded_at, description: "{{ doc('raw_loaded_at') }}", data_type: timestamp_tz}

