name: demo_core
version: 1.0.0
config-version: 2
profile: default

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

vars:
  sandbox: null

quoting:
  database: false
  schema: false
  identifier: false

models:
  demo_core:
    core_slv:
      sales:
        +database: CORE_SLV
        +schema: sales
        staging:
          +materialized: view
          +group: sales
          +access: private
        intermediate:
          +materialized: table
          +group: sales
          +access: protected
      billing:
        +database: CORE_SLV
        +schema: billing
        staging:
          +materialized: view
          +group: billing
          +access: private
        intermediate:
          +materialized: table
          +group: billing
          +access: protected
      product:
        +database: CORE_SLV
        +schema: product
        staging:
          +materialized: view
          +group: product
          +access: private
        intermediate:
          +materialized: table
          +group: product
          +access: protected
      finance_operations:
        +database: CORE_SLV
        +schema: finance_operations
        staging:
          +materialized: view
          +group: finance_operations
          +access: private
        intermediate:
          +materialized: table
          +group: finance_operations
          +access: protected
      core:
        +database: CORE_SLV
        +schema: core
        intermediate:
          +materialized: table
          +group: core
          +access: protected
          int_core__country_codes:
            +materialized: ephemeral
        public:
          +materialized: table
          +group: core
          +access: public




seeds:
  demo_core:
    +database: CORE_CONFIG
    +schema: reference
    +quote_columns: false
    country_codes:
      +column_types:
        raw_country: varchar
        country_code: varchar(2)
        country_name: varchar
    plan_catalog:
      +column_types:
        plan_code: varchar
        plan_name: varchar
        billing_interval: varchar
        list_price_cents: number(18,0)
        currency: varchar(3)
        product_family: varchar
    chart_of_accounts:
      +column_types:
        account_code: varchar
        account_name: varchar
        account_type: varchar
        financial_statement: varchar
        sign_convention: varchar

data_tests:
  demo_core:
    +database: CORE_CONFIG
    +schema: audit



query-comment:
  comment: "demo_core | {{ node.unique_id if node is defined else 'operation' }}"
  append: true
