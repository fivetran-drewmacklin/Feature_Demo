version: 2

models:
  - name: invoice_financials
    description: >
      Governed one-invoice finance fact with source-currency audit fields and
      issue-date USD valuation for invoicing, receivables, payments, refunds,
      and net collections.
    config:
      contract:
        enforced: true
      tags: [public_interface, finance]
      meta:
        data_product: finance
        data_classification: internal
        grain: one_invoice
    data_tests:
      - accepted_values:
          arguments:
            column_name: status
            values: [draft, open, paid, uncollectible, void]
    columns:
      - {name: invoice_id, description: Stable invoice identifier and model grain., data_type: varchar, constraints: [{type: not_null}], data_tests: [unique, not_null]}
      - {name: invoice_number, description: Human-readable billing-platform invoice number., data_type: varchar}
      - {name: customer_id, description: Conformed customer identifier from demo_core., data_type: varchar, constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: billing_customer_id, description: Billing-platform customer identifier., data_type: varchar}
      - {name: subscription_id, description: Associated subscription when the invoice is subscription-backed., data_type: varchar}
      - {name: status, description: Normalized invoice lifecycle status., data_type: varchar, constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: issue_date, description: Invoice issue date used to select the reporting FX rate., data_type: date, constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: due_date, description: Contractual payment due date., data_type: date}
      - {name: paid_at, description: Settlement timestamp for paid invoices., data_type: timestamp_tz}
      - {name: source_currency, description: ISO currency code of the source invoice amounts., data_type: varchar, constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: fx_rate_to_usd, description: Issue-date source-currency-to-USD rate; USD invoices use 1., data_type: "number(18,8)", constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: fx_rate_source_date, description: Date of the exact or carried-forward FX observation; issue date for USD., data_type: date, constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: used_prior_fx_rate, description: Whether a prior available FX observation was carried forward., data_type: boolean, constraints: [{type: not_null}]}
      - {name: fx_provider, description: FX provider or identity for USD invoices., data_type: varchar, constraints: [{type: not_null}]}
      - {name: subtotal_cents, description: Source invoice subtotal in minor currency units., data_type: "number(18,0)"}
      - {name: discount_cents, description: Source invoice discount in minor currency units., data_type: "number(18,0)"}
      - {name: tax_cents, description: Source invoice tax in minor currency units., data_type: "number(18,0)"}
      - {name: total_cents, description: Source invoice total in minor currency units., data_type: "number(18,0)"}
      - {name: amount_due_cents, description: Outstanding receivable in minor currency units., data_type: "number(18,0)"}
      - {name: calculated_subtotal_cents, description: Recomputed invoice subtotal in minor currency units., data_type: "number(38,0)"}
      - {name: calculated_discount_cents, description: Recomputed discount in minor currency units., data_type: "number(38,0)"}
      - {name: calculated_tax_cents, description: Recomputed tax in minor currency units., data_type: "number(38,0)"}
      - {name: calculated_total_cents, description: Recomputed invoice total in minor currency units., data_type: "number(38,0)"}
      - {name: successful_payment_cents, description: Successful payments in minor currency units., data_type: "number(38,0)"}
      - {name: successful_refund_cents, description: Successful refunds in minor currency units., data_type: "number(38,0)"}
      - {name: net_collections_cents, description: Successful payments less successful refunds in minor currency units., data_type: "number(38,0)"}
      - {name: invoice_amount, description: Invoice total in major units of source_currency., data_type: "number(38,2)"}
      - {name: outstanding_receivable_amount, description: Outstanding receivable in major units of source_currency., data_type: "number(38,2)"}
      - {name: successful_payment_amount, description: Successful payments in major units of source_currency., data_type: "number(38,2)"}
      - {name: refund_amount, description: Successful refunds in major units of source_currency., data_type: "number(38,2)"}
      - {name: net_collections_amount, description: Net collections in major units of source_currency., data_type: "number(38,2)"}
      - {name: invoice_amount_usd, description: Invoice total converted to USD at the governed issue-date rate., data_type: "number(38,2)"}
      - {name: outstanding_receivable_amount_usd, description: Outstanding receivable converted to USD at the governed issue-date rate., data_type: "number(38,2)"}
      - {name: successful_payment_amount_usd, description: Successful payments converted to USD at the governed issue-date rate., data_type: "number(38,2)"}
      - {name: refund_amount_usd, description: Successful refunds converted to USD at the governed issue-date rate., data_type: "number(38,2)"}
      - {name: net_collections_amount_usd, description: Net collections converted to USD at the governed issue-date rate., data_type: "number(38,2)"}
      - {name: is_reconciled, description: Whether the source invoice total agrees with its recomputed line total., data_type: boolean}
      - {name: reconciliation_difference_cents, description: Source total less recomputed total in minor currency units., data_type: "number(38,0)"}
      - {name: record_updated_at, description: Latest business-record update timestamp used by the upstream incremental model., data_type: timestamp_tz}
      - {name: _loaded_at, description: Latest contributing raw ingestion timestamp., data_type: timestamp_tz}

unit_tests:
  - name: invoice_financials_converts_source_amounts_to_usd
    description: USD uses an identity rate while non-USD invoices use the governed issue-date rate and preserve fallback provenance.
    model: invoice_financials
    given:
      - input: ref('demo_core', 'invoices')
        rows:
          - {invoice_id: inv_usd, invoice_number: USD-1, customer_id: customer_1, billing_customer_id: billing_1, status: paid, issue_date: '2026-01-01', currency: USD, total_cents: 10000, amount_due_cents: 2500, successful_payment_cents: 7500, successful_refund_cents: 500, net_collections_cents: 7000}
          - {invoice_id: inv_eur, invoice_number: EUR-1, customer_id: customer_2, billing_customer_id: billing_2, status: paid, issue_date: '2026-01-01', currency: EUR, total_cents: 10000, amount_due_cents: 2500, successful_payment_cents: 7500, successful_refund_cents: 500, net_collections_cents: 7000}
      - input: ref('demo_core', 'fx_rates')
        rows:
          - {rate_date: '2026-01-01', from_currency: EUR, rate: 1.2, source_rate_date: '2025-12-31', used_prior_rate: true, provider: test_provider}
    expect:
      rows:
        - {invoice_id: inv_usd, source_currency: USD, fx_rate_to_usd: 1, fx_rate_source_date: '2026-01-01', used_prior_fx_rate: false, fx_provider: identity, invoice_amount_usd: 100.00, outstanding_receivable_amount_usd: 25.00, successful_payment_amount_usd: 75.00, refund_amount_usd: 5.00, net_collections_amount_usd: 70.00}
        - {invoice_id: inv_eur, source_currency: EUR, fx_rate_to_usd: 1.2, fx_rate_source_date: '2025-12-31', used_prior_fx_rate: true, fx_provider: test_provider, invoice_amount_usd: 120.00, outstanding_receivable_amount_usd: 30.00, successful_payment_amount_usd: 90.00, refund_amount_usd: 6.00, net_collections_amount_usd: 84.00}
