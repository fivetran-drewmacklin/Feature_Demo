name: demo_finance
version: 1.0.0
config-version: 2
profile: default

dbt-cloud:
  project-id: 70403104003890


model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

vars:
  sandbox: null

quoting:
  database: false
  schema: false
  identifier: false

models:
  demo_finance:
    +persist_docs:
      relation: true
      columns: true

    intermediate:
      +database: FINANCE_GLD
      +materialized: table
      +access: protected
      mrr:
        +schema: mrr
      revenue:
        +schema: revenue
      receivables:
        +schema: receivables
      retention:
        +schema: retention

    marts:
      +database: FINANCE_GLD
      +materialized: table
      +access: public
      mrr:
        +schema: mrr
      revenue:
        +schema: revenue
      receivables:
        +schema: receivables
      retention:
        +schema: retention

data_tests:
  demo_finance:
    +database: FINANCE_CONFIG
    +schema: audit

info_schema:
  version: 1

query-comment:
  comment: "demo_finance | {{ node.unique_id if node is defined else 'operation' }}"
  append: true
